cursor:pointer;box-shadow:0 10px 28px #ffb0004c,inset 0 2px 0 #fff8}.party{position:absolute;inset:0;opacity:0;transform:scale(.96);pointer-events:none;overflow:hidden;background:radial-gradient(circle at 50% 68%,#6e199b77 0,transparent 31%),linear-gradient(#1b0730,#0a0214);transition:opacity .6s ease .08s,transform .72s cubic-bezier(.2,.9,.2,1) .08s}.scene.revealed .party{opacity:1;transform:scale(1);pointer-events:auto}.curtain{position:absolute;top:0;bottom:0;width:24%;z-index:1;background:repeating-linear-gradient(90deg,#4b000b 0 28px,#a80d20 28px 58px,#4b000b 58px 85px);filter:drop-shadow(0 0 18px #0009)}.curtain.l{left:-9%;transform:skewX(-5deg)}.curtain.r{right:-9%;transform:skewX(5deg)}.beam{position:absolute;top:-18vh;left:50%;width:10vw;height:120vh;clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);transform-origin:50% 0;mix-blend-mode:screen;opacity:.85;z-index:2}.b1{background:#ffd748;animation:s1 4.9s ease-in-out infinite alternate}.b2{background:#30e6a4;animation:s2 5.6s ease-in-out infinite alternate}.b3{background:#35bdff;animation:s3 4.4s ease-in-out infinite alternate}.b4{background:#b74bff;animation:s4 5.1s ease-in-out infinite alternate}.b5{background:#ff359a;animation:s5 4.6s ease-in-out infinite alternate}@keyframes s1{from{transform:translateX(-50%) rotate(-36deg)}to{transform:translateX(-50%) rotate(-9deg)}}@keyframes s2{from{transform:translateX(-50%) rotate(-21deg)}to{transform:translateX(-50%) rotate(15deg)}}@keyframes s3{from{transform:translateX(-50%) rotate(-8deg)}to{transform:translateX(-50%) rotate(31deg)}}@keyframes s4{from{transform:translateX(-50%) rotate(12deg)}to{transform:translateX(-50%) rotate(-29deg)}}@keyframes s5{from{transform:translateX(-50%) rotate(30deg)}to{transform:translateX(-50%) rotate(5deg)}}.floor{position:absolute;left:0;right:0;bottom:0;height:34%;z-index:3;background:linear-gradient(180deg,#16021b00,#16021bcc),repeating-linear-gradient(90deg,#210332 0 52px,#43105a 52px 54px,#210332 54px 106px);border-top:4px solid #f7c755;box-shadow:0 -8px 35px #ffb32833}.marquee{position:absolute;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);width:min(90vw,900px);min-height:112px;padding:18px 82px;border-radius:36px;border:6px solid #ffc039;background:linear-gradient(#d31518,#f43b22 22%,#a90d12);box-shadow:0 12px 32px #0009,inset 0 -7px 0 #750005;z-index:20;text-align:center}.marquee:before{content:"";position:absolute;inset:8px;border-radius:25px;background:radial-gradient(circle,#fff7b0 0 4px,transparent 5px) 0 0/33px 33px;box-shadow:inset 0 0 0 2px #ffd963;opacity:.9}.title{position:relative;z-index:2;font-size:clamp(42px,7vw,82px);font-weight:1000;letter-spacing:-.06em;color:#ffe05a;text-shadow:0 4px 0 #7f3500,0 0 13px #fff6;white-space:nowrap}.star{position:absolute;top:50%;transform:translateY(-50%);z-index:3;color:#ffd748;font-size:clamp(40px,6vw,68px);text-shadow:0 3px 0 #8b3a00}.sl{left:20px}.sr{right:20px}.gift{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);width:min(26vw,270px);aspect-ratio:1.1/1;z-index:4;filter:drop-shadow(0 18px 30px #0009)}.box{position:absolute;left:8%;right:8%;top:33%;bottom:4%;border:4px solid #ff9b84;border-radius:8px;background:linear-gradient(135deg,#ff294a,#d60c30)}.box:before{content:"";position:absolute;left:43%;top:-4px;bottom:-4px;width:15%;background:linear-gradient(#ffe166,#f5b81f)}.lid{position:absolute;left:2%;right:2%;top:20%;height:18%;border:4px solid #ffb19c;border-radius:8px;background:linear-gradient(#ff536d,#ed1843)}.lid:before{content:"";position:absolute;left:44%;top:-4px;bottom:-4px;width:14%;background:#ffd34f}.bow{position:absolute;left:50%;top:3%;width:88px;height:58px;transform:translateX(-50%)}.bow:before,.bow:after{content:"";position:absolute;top:0;width:50px;height:40px;border:12px solid #ffd748;border-radius:50%}.bow:before{right:41px;transform:rotate(22deg)}.bow:after{left:41px;transform:rotate(-22deg)}.cast{position:absolute;inset:0;z-index:12}.person{position:absolute;bottom:2.5%;width:170px;height:290px;transform-origin:50% 100%;filter:drop-shadow(0 13px 9px #0008)}.hero{width:255px;height:410px;z-index:14}.head{position:absolute;left:50%;top:0;transform:translateX(-50%);width:132px;height:150px;border-radius:47% 47% 50% 50%/44% 44% 56% 56%;overflow:hidden;background:#efceb6;border:4px solid #f6d9c4;box-shadow:0 9px 16px #0005;z-index:8}.hero .head{width:190px;height:215px}.face{width:100%;height:100%;object-fit:cover;object-position:center 53%;display:block}.body{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:116px;height:150px}.hero .body{width:174px;height:207px}.jacket{position:absolute;left:50%;top:9px;transform:translateX(-50%);width:100%;height:71%;border-radius:28px 28px 17px 17px;background:linear-gradient(#146fff,#074ed9 60%,#0039b8);box-shadow:inset 0 -9px 0 #002b9455}.jacket:before,.jacket:after{content:"";position:absolute;top:6px;width:42%;height:48%;background:#0a55df;clip-path:polygon(0 0,100% 30%,55% 100%)}.jacket:before{left:4%}.jacket:after{right:4%;transform:scaleX(-1)}.shirt{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:43%;height:43%;background:#fff;border-radius:0 0 13px 13px;z-index:3}.bowtie{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:37px;height:22px;background:#ec1627;clip-path:polygon(0 50%,28% 8%,50% 50%,72% 8%,100% 50%,72% 92%,50% 50%,28% 92%);z-index:4}.hero .bowtie{width:50px;height:29px}.button{position:absolute;left:50%;top:52%;width:13px;height:13px;transform:translateX(-50%);border-radius:50%;background:#ffd538;border:2px solid #b98500;z-index:5}.shorts{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:90%;height:32%;background:#8a929d;border-radius:5px 5px 15px 15px;z-index:2}.arm,.leg{position:absolute;display:block}.arm{top:27px;width:22px;height:76px;border-radius:14px;background:#0b58e9;transform-origin:50% 12px;z-index:1}.arm:after{content:"";position:absolute;left:50%;top:-5px;transform:translateX(-50%);width:27px;height:27px;border-radius:50%;background:#f1ccb0}.hero .arm{width:31px;height:108px}.hero .arm:after{width:38px;height:38px;top:-8px}.arm.l{left:-8px;transform:rotate(-34deg)}.arm.r{right:-7px;transform:rotate(34deg)}.hero .arm.r{transform:rotate(64deg) translateY(-6px)}.leg{bottom:-8px;width:25px;height:78px;background:linear-gradient(#f1c9ad 0 40%,#fff 41% 74%,#0b0b0e 75%);border-radius:12px}.hero .leg{width:31px;height:104px}.leg.l{left:20px;transform:rotate(8deg)}.leg.r{right:20px;transform:rotate(-8deg)}.c1{left:1%;animation:d1 .74s ease-in-out infinite alternate}.c2{left:18%;bottom:7%;animation:d2 .76s ease-in-out infinite alternate .1s}.c3{left:50%;bottom:0;transform:translateX(-50%);animation:d3 .72s ease-in-out infinite alternate}.c4{right:18%;bottom:7%;animation:d4 .8s ease-in-out infinite alternate .18s}.c5{right:1%;animation:d5 .75s ease-in-out infinite alternate .08s}@keyframes d1{from{transform:translateY(3px) rotate(-5deg)}to{transform:translateY(-17px) rotate(6deg)}}@keyframes d2{from{transform:translateY(2px) rotate(4deg)}to{transform:translateY(-14px) rotate(-5deg)}}@keyframes d3{from{transform:translateX(-50%) translateY(4px) rotate(-3deg)}to{transform:translateX(-50%) translateY(-14px) rotate(3deg)}}@keyframes d4{from{transform:translateY(3px) rotate(-4deg)}to{transform:translateY(-13px) rotate(5deg)}}@keyframes d5{from{transform:translateY(2px) rotate(4deg)}to{transform:translateY(-17px) rotate(-5deg)}}.person .head{animation:headbob .7s ease-in-out infinite alternate}@keyframes headbob{to{transform:translateX(-50%) translateY(-6px)}}.audio{position:absolute;right:14px;top:max(14px,env(safe-area-inset-top));z-index:50;width:45px;height:45px;border:1px solid #fff5;border-radius:50%;background:#0008;color:#fff;font-size:20px;cursor:pointer}.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:100}.flash.on{animation:flash .55s ease}@keyframes flash{0%{opacity:0}28%{opacity:.96}100%{opacity:0}}.confetti{position:absolute;top:-25px;width:13px;height:8px;border-radius:2px;z-index:40;animation:fall linear forwards}@keyframes fall{from{opacity:1;transform:translate(0,0) rotate(0)}to{opacity:0;transform:translate(var(--dx),115vh) rotate(760deg)}}@media(max-width:760px){.haz{height:34px}.beacon{width:86px;height:86px}.beacon:before{left:17px;right:17px;top:11px;height:47px}.beacon:after{left:14px;right:14px;bottom:8px;height:14px}.alert{width:91vw;padding:23px 15px 25px}.start{font-size:15px;padding:13px 22px}.marquee{width:95vw;min-height:78px;padding:13px 48px;border-width:4px;border-radius:25px}.marquee:before{inset:6px;background-size:27px 27px}.sl{left:8px}.sr{right:8px}.gift{width:39vw;top:52%}.person{width:105px;height:184px}.hero{width:158px;height:270px}.head{width:76px;height:86px;border-width:3px}.hero .head{width:114px;height:128px}.body{width:69px;height:92px}.hero .body{width:104px;height:136px}.arm{width:15px;height:50px}.arm:after{width:19px;height:19px}.hero .arm{width:21px;height:72px}.hero .arm:after{width:27px;height:27px}.leg{width:16px;height:50px}.hero .leg{width:21px;height:68px}.bowtie{width:24px;height:15px}.hero .bowtie{width:32px;height:18px}.c1{left:-4%}.c2{left:12%;bottom:9%}.c4{right:11%;bottom:9%}.c5{right:-4%}.floor{height:31%}}</style></head><body><div class="scene" id="scene"><section class="emergency"><div class="scan"></div><div class="haz top"></div><div class="haz bottom"></div><div class="beacon red"></div><div class="beacon blue"></div><div class="pipo pl">삐뽀</div><div class="pipo pr">삐뽀</div><div class="alert"><div class="badge"><span class="dot"></span>긴급 · 중요 공지</div><h1>속보입니다</h1><div class="sub">잠시만요! 중요한 소식이 있습니다</div><div class="mini">경고등이 점멸 중입니다 · 아래 버튼을 눌러 확인하세요</div></div><button class="start" id="start">🚨 속보 확인하기</button></section><section class="party"><div class="curtain l"></div><div class="curtain r"></div><i class="beam b1"></i><i class="beam b2"></i><i class="beam b3"></i><i class="beam b4"></i><i class="beam b5"></i><div class="marquee"><span class="star sl">★</span><div class="title">속 보인다구요</div><span class="star sr">★</span></div><div class="gift"><div class="bow"></div><div class="lid"></div><div class="box"></div></div><div class="cast" id="cast"></div><div class="floor"></div><button class="audio" id="audio" hidden>🔊</button></section><div class="flash" id="flash"></div></div><script>const OLD='https://raw.githubusercontent.com/GPterthunder/gpterthunder.github.io/69917742e8cbea874f9a87b1a35efa177af6e419/index.html';const cast=document.getElementById('cast');function person(cls,hero=false){return `<div class="person ${hero?'hero ':''}${cls}"><div class="head"><img class="face"></div><div class="body"><i class="jacket"></i><i class="shirt"></i><i class="bowtie"></i><i class="button"></i><i class="shorts"></i><i class="arm l"></i><i class="arm r"></i><i class="leg l"></i><i class="leg r"></i></div></div>`}cast.innerHTML=person('c1')+person('c2')+person('c3',true)+person('c4')+person('c5');fetch(OLD,{cache:'force-cache'}).then(r=>r.text()).then(t=>{const m=t.match(/data:image\/png;base64,([A-Za-z0-9+/=]+)/);if(m)document.querySelectorAll('.face').forEach(i=>i.src='data:image/png;base64,'+m[1]);}).catch(()=>{});const scene=document.getElementById('scene'),start=document.getElementById('start'),flash=document.getElementById('flash'),audio=document.getElementById('audio');let ctx,master,muted=false,started=false,bgm=false,next=0;function init(){if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();master=ctx.createGain();master.gain.value=.82;master.connect(ctx.destination)}}function tone(f,t,d,v=.07,type='triangle'){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03)}function drum(t,p=120,d=.11,v=.72){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(p,t);o.frequency.exponentialRampToValueAtTime(58,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03)}function crash(t){const b=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=ctx.createBufferSource(),hp=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=b;hp.type='highpass';hp.frequency.value=2800;g.gain.setValueAtTime(.45,t);g.gain.exponentialRampToValueAtTime(.001,t+.95);s.connect(hp);hp.connect(g);g.connect(master);s.start(t);s.stop(t+1)}function confetti(){const cols=['#ff4f9a','#ffd44b','#30c8ff','#8cff78','#ba52ff','#ff9842'];for(let i=0;i<140;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=cols[Math.floor(Math.random()*cols.length)];c.style.setProperty('--dx',(Math.random()-.5)*420+'px');c.style.animationDuration=2.1+Math.random()*1.9+'s';document.querySelector('.party').appendChild(c);setTimeout(()=>c.remove(),4300)}}function music(st){const beat=.39,n=[523,659,784,1047,988,784,659,587,659,784,880,1047,1175,1047,988,784,659,784,1047,1319,1175,1047,880,784];let t=st;n.forEach((f,i)=>{tone(f,t,beat*.82,.055);if(i%4===0){drum(t,95,.08,.1);tone(f/4,t,beat*1.8,.035,'sine')}t+=beat});return t-st}function loop(){if(!bgm)return;const l=music(next);next+=l;setTimeout(loop,Math.max(250,(next-ctx.currentTime-.5)*1000))}start.onclick=async()=>{if(started)return;started=true;start.disabled=true;start.textContent='삐뽀… 두구두구두구…';init();if(ctx.state==='suspended')await ctx.resume();const n=ctx.currentTime+.04;tone(780,n,.16,.12,'square');tone(1040,n+.18,.16,.12,'square');tone(780,n+.38,.16,.1,'square');tone(1040,n+.56,.16,.1,'square');const r=n+.78;for(let i=0;i<8;i++)drum(r+i*.12,122+i*2,.09,.69);const bam=r+.96+.1;drum(bam,88,.4,1);crash(bam);setTimeout(()=>{scene.classList.add('revealed');flash.classList.add('on');confetti();setTimeout(confetti,2100);setTimeout(()=>flash.classList.remove('on'),650);audio.hidden=false;bgm=true;next=ctx.currentTime+.18;loop()},Math.max(0,(bam-ctx.currentTime)*1000))};audio.onclick=()=>{muted=!muted;master.gain.setTargetAtTime(muted?0:.82,ctx.currentTime,.025);audio.textContent=muted?'🔇':'🔊'};</script></body></html>
