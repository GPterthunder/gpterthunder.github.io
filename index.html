<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#12041d">
  <title>속보입니다</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene" id="scene">
    <div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div>
    <div class="beam b4"></div><div class="beam b5"></div><div class="beam b6"></div>
    <div class="floorGlow"></div>

    <section class="stage" aria-live="polite">
      <div class="posterWrap">
        <img id="posterBefore" class="poster" alt="속보입니다">
        <img id="posterAfter" class="poster" alt="속 보인다구요">
      </div>
    </section>

    <div id="flash" class="flash"></div>

    <div class="controls" id="controls">
      <button class="startBtn" id="startBtn" disabled>
        <span id="buttonText">화면 준비 중…</span>
      </button>
    </div>

    <button class="audioBtn" id="audioBtn" type="button" hidden aria-label="음악 끄기">🔊</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
