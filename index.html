<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#130104"><title>속보입니다</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070006;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}body{user-select:none;-webkit-user-select:none}.scene{position:relative;width:100vw;height:100dvh;min-height:100vh;overflow:hidden;color:#fff}.intro{position:absolute;inset:0;z-index:30;background:radial-gradient(circle at 50% 45%,#65080b 0,#270104 43%,#080001 82%);transition:.62s ease;overflow:hidden}.scene.revealed .intro{opacity:0;transform:scale(1.08);filter:blur(8px);pointer-events:none}.haz{position:absolute;left:-5%;width:110%;height:46px;background:repeating-linear-gradient(135deg,#ffd532 0 30px,#111 30px 60px);box-shadow:0 4px 20px #000b}.haz.top{top:0}.haz.bottom{bottom:0}.siren{position:absolute;top:7%;width:min(34vw,340px);height:min(34vw,340px);border-radius:50%;filter:blur(18px);mix-blend-mode:screen}.siren.red{left:-8%;background:#ff1e1e;animation:rp .64s steps(1) infinite}.siren.blue{right:-8%;background:#2878ff;animation:bp .64s steps(1) infinite}@keyframes rp{0%,49%{opacity:.88}50%,100%{opacity:.05}}@keyframes bp{0%,49%{opacity:.05}50%,100%{opacity:.88}}.alert{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);width:min(90vw,900px);padding:32px 22px;border:4px solid #ffd22e;border-radius:26px;background:linear-gradient(#7c0b0d,#3e0004 58%,#180002);box-shadow:0 0 0 8px #111,0 0 55px #ff2c1d73,inset 0 0 40px #ff8b1730;text-align:center}.badge{display:inline-flex;gap:9px;align-items:center;padding:8px 16px;border-radius:999px;background:#1a0001;border:2px solid #ffbc18;color:#ffe161;font-weight:1000;letter-spacing:.11em}.blink{width:10px;height:10px;border-radius:50%;background:#ff2929;box-shadow:0 0 16px #ff2929;animation:bl .5s steps(1) infinite}@keyframes bl{50%{opacity:.18}}.alert h1{margin:14px 0 8px;font-size:clamp(54px,10vw,120px);font-weight:1000;line-height:.94;letter-spacing:-.07em;color:#fff0d1;text-shadow:0 5px 0 #740000,0 0 23px #ff3b23}.sub{margin:15px 0 7px;color:#ffe05d;font-size:clamp(18px,3vw,30px);font-weight:900}.mini{margin:0 0 24px;color:#ffd8d0;opacity:.85}.start{border:0;border-radius:999px;padding:15px 28px;background:linear-gradient(#ffe979,#ffba15);color:#210000;font-weight:1000;font-size:17px;cursor:pointer;box-shadow:0 12px 28px #ffb00045,inset 0 2px 0 #fff9}.party{position:absolute;inset:0;opacity:0;transform:scale(.96);pointer-events:none;overflow:hidden;background:radial-gradient(circle at 50% 72%,#8b33c955 0,transparent 30%),linear-gradient(#17062d,#090212);transition:opacity .65s ease .08s,transform .72s cubic-bezier(.2,.9,.2,1) .08s}.scene.revealed .party{opacity:1;transform:scale(1);pointer-events:auto}.beam{position:absolute;top:-17vh;left:50%;width:11vw;height:120vh;clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);transform-origin:50% 0;mix-blend-mode:screen;opacity:.82}.b1{background:#ffd743;animation:s1 4.8s ease-in-out infinite alternate}.b2{background:#2ce8a3;animation:s2 5.5s ease-in-out infinite alternate}.b3{background:#31bcff;animation:s3 4.3s ease-in-out infinite alternate}.b4{background:#b649ff;animation:s4 5s ease-in-out infinite alternate}.b5{background:#ff3599;animation:s5 4.6s ease-in-out infinite alternate}.b6{background:#ff9940;animation:s6 5.4s ease-in-out infinite alternate}@keyframes s1{from{transform:translateX(-50%) rotate(-36deg)}to{transform:translateX(-50%) rotate(-8deg)}}@keyframes s2{from{transform:translateX(-50%) rotate(-22deg)}to{transform:translateX(-50%) rotate(15deg)}}@keyframes s3{from{transform:translateX(-50%) rotate(-8deg)}to{transform:translateX(-50%) rotate(31deg)}}@keyframes s4{from{transform:translateX(-50%) rotate(11deg)}to{transform:translateX(-50%) rotate(-29deg)}}@keyframes s5{from{transform:translateX(-50%) rotate(28deg)}to{transform:translateX(-50%) rotate(5deg)}}@keyframes s6{from{transform:translateX(-50%) rotate(38deg)}to{transform:translateX(-50%) rotate(-14deg)}}.floor{position:absolute;left:0;right:0;bottom:0;height:34%;background:repeating-linear-gradient(90deg,#190224 0 54px,#4d1761 54px 57px,#190224 57px 111px);border-top:4px solid #f1c14f;box-shadow:0 -10px 40px #f0b63033}.marquee{position:absolute;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);width:min(94vw,940px);padding:15px 70px;border:5px solid #ffc13b;border-radius:30px;background:linear-gradient(#ee3a25,#bb1217 74%,#8d0a0f);box-shadow:0 12px 34px #0009,inset 0 -5px 0 #720409;text-align:center;z-index:20}.marquee:before,.marquee:after{content:"★";position:absolute;top:50%;transform:translateY(-50%);font-size:clamp(36px,6vw,70px);color:#ffde50}.marquee:before{left:18px}.marquee:after{right:18px}.marquee strong{font-size:clamp(40px,7vw,84px);font-weight:1000;letter-spacing:-.06em;color:#ffe25d;text-shadow:0 4px 0 #843800,0 0 13px #fff6;white-space:nowrap}.cast{position:absolute;left:50%;bottom:max(1.5vh,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(100vw,1260px);height:min(76vh,810px);z-index:12}.person{position:absolute;bottom:0;width:172px;height:295px;transform-origin:50% 100%;filter:drop-shadow(0 14px 13px #0008)}.hero{width:255px;height:405px;z-index:6}.head{position:absolute;left:50%;top:0;transform:translateX(-50%);width:134px;height:151px;border-radius:46% 46% 49% 49%/42% 42% 57% 57%;overflow:hidden;background:#edc9ac;border:3px solid #f2d6c3;box-shadow:0 8px 14px #0005;z-index:6}.hero .head{width:190px;height:214px}.sprite{position:absolute;max-width:none;width:619%;left:-259%;top:-65%}.hero .sprite{width:619%;left:-259%;top:-65%}.body{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:116px;height:153px}.hero .body{width:174px;height:210px}.jacket{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:100%;height:70%;border-radius:28px 28px 17px 17px;background:linear-gradient(#1873ff,#0750df 62%,#003cb9);box-shadow:inset 0 -9px 0 #002b9550}.jacket:before,.jacket:after{content:"";position:absolute;top:7px;width:43%;height:48%;background:#0a54df;clip-path:polygon(0 0,100% 30%,54% 100%)}.jacket:before{left:4%}.jacket:after{right:4%;transform:scaleX(-1)}.shirt{position:absolute;left:50%;top:9px;transform:translateX(-50%);width:43%;height:42%;background:#fff;border-radius:0 0 13px 13px;z-index:3}.bow{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:39px;height:22px;background:#ed1729;clip-path:polygon(0 50%,28% 8%,50% 50%,72% 8%,100% 50%,72% 92%,50% 50%,28% 92%);z-index:4}.hero .bow{width:52px;height:29px}.shorts{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:90%;height:32%;background:#7f8996;border-radius:5px 5px 15px 15px;z-index:2}.arm,.leg{position:absolute;display:block}.arm{top:27px;width:22px;height:76px;border-radius:14px;background:#0c59e9;transform-origin:50% 12px}.arm:after{content:"";position:absolute;left:50%;top:-5px;transform:translateX(-50%);width:27px;height:27px;border-radius:50%;background:#efc8ab}.hero .arm{width:31px;height:108px}.hero .arm:after{width:38px;height:38px;top:-8px}.arm.l{left:-8px;transform:rotate(-34deg)}.arm.r{right:-7px;transform:rotate(34deg)}.p2 .arm.l{transform:rotate(52deg)}.p2 .arm.r{transform:rotate(-42deg)}.hero .arm.r{transform:rotate(64deg) translateY(-5px)}.p4 .arm.l{transform:rotate(86deg)}.p5 .arm.r{transform:rotate(58deg)}.leg{bottom:-8px;width:25px;height:79px;border-radius:12px;background:linear-gradient(#efc5a7 0 39%,#fff 40% 73%,#111 74%)}.hero .leg{width:31px;height:105px}.leg.l{left:20px;transform:rotate(8deg)}.leg.r{right:20px;transform:rotate(-8deg)}.p1{left:1%;animation:d1 .74s ease-in-out infinite alternate}.p2{left:18%;bottom:6%;animation:d2 .8s ease-in-out infinite alternate .1s}.p3{left:50%;transform:translateX(-50%);animation:d3 .72s ease-in-out infinite alternate}.p4{right:18%;bottom:6%;animation:d4 .82s ease-in-out infinite alternate .18s}.p5{right:1%;animation:d5 .76s ease-in-out infinite alternate .07s}@keyframes d1{from{transform:translateY(3px) rotate(-6deg)}to{transform:translateY(-18px) rotate(6deg)}}@keyframes d2{from{transform:translateY(2px) rotate(5deg)}to{transform:translateY(-15px) rotate(-5deg)}}@keyframes d3{from{transform:translateX(-50%) translateY(3px) rotate(-3deg)}to{transform:translateX(-50%) translateY(-15px) rotate(3deg)}}@keyframes d4{from{transform:translateY(4px) rotate(-5deg)}to{transform:translateY(-14px) rotate(5deg)}}@keyframes d5{from{transform:translateY(2px) rotate(5deg)}to{transform:translateY(-17px) rotate(-5deg)}}.audio{position:absolute;right:14px;top:max(14px,env(safe-area-inset-top));z-index:40;width:44px;height:44px;border-radius:50%;border:1px solid #fff4;background:#0008;color:white;font-size:20px}.flash{position:absolute;inset:0;z-index:60;background:#fff;opacity:0;pointer-events:none}.flash.on{animation:fl .53s ease}@keyframes fl{0%{opacity:0}28%{opacity:.97}100%{opacity:0}}.confetti{position:absolute;top:-25px;width:13px;height:8px;border-radius:2px;z-index:45;animation:fall linear forwards}@keyframes fall{from{opacity:1;transform:translate(0,0) rotate(0)}to{opacity:0;transform:translate(var(--dx),115vh) rotate(780deg)}}@media(max-width:720px){.alert{width:92vw;padding:26px 16px}.haz{height:35px}.marquee{width:96vw;padding:12px 44px;border-width:4px}.marquee:before{left:8px}.marquee:after{right:8px}.cast{height:72vh}.person{width:112px;height:195px}.hero{width:166px;height:270px}.head{width:82px;height:94px}.hero .head{width:122px;height:138px}.body{width:75px;height:100px}.hero .body{width:112px;height:140px}.arm{width:15px;height:50px}.arm:after{width:19px;height:19px}.hero .arm{width:20px;height:72px}.hero .arm:after{width:26px;height:26px}.leg{width:16px;height:52px}.hero .leg{width:21px;height:70px}.p1{left:-5%}.p2{left:11%}.p4{right:11%}.p5{right:-5%}.start{padding:14px 22px}}</style></head><body><main class="scene" id="scene"><section class="intro"><div class="haz top"></div><div class="haz bottom"></div><div class="siren red"></div><div class="siren blue"></div><div class="alert"><div class="badge"><span class="blink"></span>긴급 · 중요 공지<span class="blink"></span></div><h1>속보입니다</h1><div class="sub">주의! 중요한 소식이 있습니다</div><div class="mini">버튼을 누르면 속보를 확인합니다</div><button class="start" id="start">속보 확인하기</button></div></section><section class="party"><i class="beam b1"></i><i class="beam b2"></i><i class="beam b3"></i><i class="beam b4"></i><i class="beam b5"></i><i class="beam b6"></i><div class="floor"></div><div class="marquee"><strong>속 보인다구요</strong></div><div class="cast" id="cast"></div><button class="audio" id="audio" hidden>🔊</button></section><div class="flash" id="flash"></div></main><script>(()=>{const scene=document.getElementById('scene'),cast=document.getElementById('cast'),btn=document.getElementById('start'),flash=document.getElementById('flash'),audio=document.getElementById('audio');let ctx,master,muted=false,bgm=false,next=0;fetch('before.b64',{cache:'no-store'}).then(r=>r.text()).then(b=>{const src='data:image/webp;base64,'+b.trim();for(let i=1;i<=5;i++){const p=document.createElement('div');p.className='person p'+i+(i===3?' hero':'');p.innerHTML=`<div class="head"><img class="sprite" src="${src}"></div><div class="body"><i class="jacket"></i><i class="shirt"></i><i class="bow"></i><i class="shorts"></i><i class="arm l"></i><i class="arm r"></i><i class="leg l"></i><i class="leg r"></i></div>`;cast.appendChild(p)}});function init(){if(!ctx){const A=window.AudioContext||window.webkitAudioContext;ctx=new A();master=ctx.createGain();master.gain.value=.82;master.connect(ctx.destination)}}function drum(t,p=125,d=.1,v=.7){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(p,t);o.frequency.exponentialRampToValueAtTime(58,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02)}function tone(f,t,d,v=.055){const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03)}function siren(t){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(680,t);o.frequency.linearRampToValueAtTime(960,t+.3);o.frequency.linearRampToValueAtTime(680,t+.6);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.12,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.6);o.connect(g);g.connect(master);o.start(t);o.stop(t+.62)}function conf(){const c=['#ff4f99','#ffd74b','#36c8ff','#7dff78','#b650ff','#ff9841'];for(let i=0;i<130;i++){const e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=c[Math.floor(Math.random()*c.length)];e.style.setProperty('--dx',(Math.random()-.5)*430+'px');e.style.animationDuration=2.1+Math.random()*1.9+'s';scene.appendChild(e);setTimeout(()=>e.remove(),4300)}}function loop(st){const n=[523,659,784,1047,988,784,659,587,659,784,1047,1175,1047,988,784,659,698,880,1047,1318,1175,1047,880,784];let t=st;for(let i=0;i<n.length;i++){tone(n[i],t,.28,.052);if(i%4===0)drum(t,105,.07,.11);t+=.34}return t}function keep(){if(!bgm)return;next=loop(next);setTimeout(keep,Math.max(300,(next-ctx.currentTime-.35)*1000))}btn.onclick=async()=>{btn.disabled=true;init();if(ctx.state==='suspended')await ctx.resume();let t=ctx.currentTime+.05;siren(t);for(let i=0;i<8;i++)drum(t+.67+i*.13,122+i*2,.09,.75);const bam=t+.67+8*.13+.12;drum(bam,92,.38,1);setTimeout(()=>{scene.classList.add('revealed');flash.classList.add('on');conf();audio.hidden=false;setTimeout(()=>flash.classList.remove('on'),620);bgm=true;next=ctx.currentTime+.18;keep()},Math.max(0,(bam-ctx.currentTime)*1000))};audio.onclick=()=>{muted=!muted;master.gain.setTargetAtTime(muted?0:.82,ctx.currentTime,.03);audio.textContent=muted?'🔇':'🔊'}})();</script></body></html>
