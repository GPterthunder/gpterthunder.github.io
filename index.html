<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120000">
<title>속보입니다</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#080000;color:#fff}
body{user-select:none;-webkit-user-select:none}
.scene{position:relative;width:100vw;height:100vh;overflow:hidden}

/* ==================== 1단계: 긴급 속보 ==================== */
.emergency{
 position:absolute;inset:0;
 background:
   radial-gradient(circle at 50% 42%,rgba(255,55,0,.22),transparent 30%),
   repeating-linear-gradient(135deg,rgba(255,198,0,.05) 0 22px,rgba(0,0,0,.05) 22px 44px),
   linear-gradient(180deg,#1d0000 0%,#080000 100%);
 z-index:10;transition:opacity .55s ease,transform .65s ease
}
.scene.revealed .emergency{opacity:0;transform:scale(1.08);pointer-events:none}

.sirenTop{position:absolute;left:0;right:0;top:0;height:18px;background:repeating-linear-gradient(90deg,#ff2b2b 0 50px,#101010 50px 100px);box-shadow:0 0 30px #ff1a1a}
.sirenBottom{position:absolute;left:0;right:0;bottom:0;height:18px;background:repeating-linear-gradient(90deg,#f7d21f 0 50px,#111 50px 100px)}

.light{position:absolute;top:10%;width:31vw;height:31vw;max-width:340px;max-height:340px;border-radius:50%;filter:blur(10px);opacity:.25;mix-blend-mode:screen}
.light.red{left:-7vw;background:#ff1515;animation:redFlash .62s steps(1) infinite}
.light.blue{right:-7vw;background:#2784ff;animation:blueFlash .62s steps(1) infinite}
@keyframes redFlash{0%,49%{opacity:.8}50%,100%{opacity:.08}}
@keyframes blueFlash{0%,49%{opacity:.08}50%,100%{opacity:.8}}

.warningTape{position:absolute;left:-8%;width:116%;height:54px;background:repeating-linear-gradient(135deg,#ffd42a 0 34px,#111 34px 68px);box-shadow:0 4px 14px #0008}
.warningTape.t1{top:14%;transform:rotate(-2deg)}
.warningTape.t2{bottom:17%;transform:rotate(2deg)}

.alertBox{
 position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 width:min(88vw,900px);padding:30px 24px 28px;border:4px solid #ffcf28;border-radius:22px;
 background:linear-gradient(180deg,rgba(98,0,0,.97),rgba(28,0,0,.97));
 box-shadow:0 0 0 7px #141414,0 0 45px #ff2c1a88,inset 0 0 35px #ff6a0038;
 text-align:center;z-index:5
}
.alertIcon{font-size:clamp(42px,8vw,86px);animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(.9)}to{transform:scale(1.08)}}
.alertTop{font-weight:900;color:#ffd626;font-size:clamp(18px,3vw,30px);letter-spacing:.12em;margin:2px 0 8px}
.alertTitle{font-weight:1000;font-size:clamp(48px,11vw,122px);line-height:.95;letter-spacing:-.07em;color:#fff3d4;text-shadow:0 5px 0 #8d0000,0 0 18px #ff3d24;animation:shake 1.2s ease-in-out infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.alertSub{margin-top:16px;font-size:clamp(16px,3.2vw,28px);font-weight:900;color:#ffdd51}
.alertMini{margin-top:8px;font-size:clamp(13px,2.3vw,18px);opacity:.88}

.startBtn{
 position:absolute;left:50%;bottom:max(32px,calc(env(safe-area-inset-bottom) + 18px));transform:translateX(-50%);
 z-index:20;border:none;border-radius:999px;padding:15px 26px;font-size:17px;font-weight:900;cursor:pointer;
 color:#160000;background:linear-gradient(#ffe36b,#ffb315);
 box-shadow:0 8px 24px #ffb00055,inset 0 2px 0 #fff7;
}
.startBtn:active{transform:translateX(-50%) translateY(2px)}

/* ==================== 2단계: 축하 반전 ==================== */
.party{
 position:absolute;inset:0;opacity:0;transform:scale(.96);pointer-events:none;
 background:
 radial-gradient(circle at 50% 62%,rgba(145,49,255,.38),transparent 27%),
 linear-gradient(180deg,#16062b 0%,#080310 100%);
 transition:opacity .6s ease .12s,transform .7s cubic-bezier(.2,.9,.2,1) .12s
}
.scene.revealed .party{opacity:1;transform:scale(1);pointer-events:auto}

.beam{position:absolute;top:-14vh;left:50%;width:12vw;height:115vh;clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);transform-origin:50% 0;mix-blend-mode:screen;opacity:.82}
.b1{background:#ffd84a;animation:s1 4.8s ease-in-out infinite alternate}
.b2{background:#2de8aa;animation:s2 5.6s ease-in-out infinite alternate}
.b3{background:#2ebcff;animation:s3 4.3s ease-in-out infinite alternate}
.b4{background:#b749ff;animation:s4 5.1s ease-in-out infinite alternate}
.b5{background:#ff359d;animation:s5 4.7s ease-in-out infinite alternate}
@keyframes s1{from{transform:translateX(-50%) rotate(-35deg)}to{transform:translateX(-50%) rotate(-8deg)}}
@keyframes s2{from{transform:translateX(-50%) rotate(-20deg)}to{transform:translateX(-50%) rotate(15deg)}}
@keyframes s3{from{transform:translateX(-50%) rotate(-7deg)}to{transform:translateX(-50%) rotate(30deg)}}
@keyframes s4{from{transform:translateX(-50%) rotate(11deg)}to{transform:translateX(-50%) rotate(-29deg)}}
@keyframes s5{from{transform:translateX(-50%) rotate(30deg)}to{transform:translateX(-50%) rotate(5deg)}}

.marquee{
 position:absolute;left:50%;top:max(16px,env(safe-area-inset-top));transform:translateX(-50%);
 width:min(92vw,900px);padding:17px 72px;border-radius:30px;
 border:5px solid #ffc43a;background:linear-gradient(#d21518,#ff4127 20%,#a90d12 100%);
 box-shadow:0 12px 30px #0008,inset 0 -5px 0 #770000;
 text-align:center;z-index:8
}
.marqueeText{font-size:clamp(36px,7.2vw,82px);font-weight:1000;letter-spacing:-.06em;color:#ffe25a;text-shadow:0 4px 0 #7f3300,0 0 14px #fff5}
.marquee:before,.marquee:after{content:"★";position:absolute;top:50%;transform:translateY(-50%);font-size:clamp(36px,6vw,70px);color:#ffd84d}
.marquee:before{left:18px}.marquee:after{right:18px}

.stage{position:absolute;left:50%;bottom:4vh;transform:translateX(-50%);width:min(99vw,1250px);height:min(74vh,820px)}
.char{position:absolute;width:155px;height:245px;transform-origin:50% 100%}
.hero{width:235px;height:360px;z-index:6}
.head{position:absolute;left:50%;top:0;transform:translateX(-50%);width:112px;height:128px;border-radius:48%;overflow:hidden;background:#efcfb6;border:3px solid #fff5;box-shadow:0 9px 18px #0006}
.hero .head{width:168px;height:190px}
.face{width:100%;height:100%;object-fit:cover;object-position:center}

.body{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);width:102px;height:126px}
.hero .body{width:155px;height:180px}
.jacket{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:100%;height:78%;background:linear-gradient(#1268ff,#003ec9);border-radius:28px 28px 18px 18px;box-shadow:inset 0 -8px 0 #002b9c55}
.shirt{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:44%;height:42%;background:#fff;border-radius:0 0 14px 14px;z-index:2}
.bow{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:34px;height:20px;background:#ec1526;z-index:3;clip-path:polygon(0 50%,28% 8%,50% 50%,72% 8%,100% 50%,72% 92%,50% 50%,28% 92%)}
.hero .bow{width:48px;height:28px}
.short{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:94%;height:34%;background:#0750df;border-radius:8px 8px 18px 18px}
.arm,.leg{position:absolute;display:block;background:#0c58ec;border-radius:16px}
.arm{top:27px;width:20px;height:70px;transform-origin:50% 12px}
.arm:after{content:"";position:absolute;left:50%;top:-3px;transform:translateX(-50%);width:25px;height:25px;background:#f1ccb0;border-radius:50%}
.hero .arm{width:30px;height:104px}.hero .arm:after{width:36px;height:36px;top:-7px}
.arm.l{left:-8px;transform:rotate(-32deg)}.arm.r{right:-7px;transform:rotate(32deg)}.hero .arm.r{transform:rotate(62deg) translateY(-4px)}
.leg{bottom:-8px;width:22px;height:70px;background:#fafafa}
.leg:after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);width:34px;height:16px;background:#0b0b0d;border-radius:12px}
.hero .leg{width:29px;height:96px}.hero .leg:after{width:43px;height:19px}
.leg.l{left:19px;transform:rotate(8deg)}.leg.r{right:19px;transform:rotate(-8deg)}

.c1{left:2%;bottom:11%}.c2{left:20%;bottom:15%}.c3{left:50%;bottom:5%;transform:translateX(-50%)}.c4{right:20%;bottom:12%}.c5{right:2%;bottom:12%}
.d1{animation:d1 .72s ease-in-out infinite alternate}.d2{animation:d2 .76s ease-in-out infinite alternate .13s}.d3{animation:d3 .72s ease-in-out infinite alternate}.d4{animation:d4 .8s ease-in-out infinite alternate .22s}.d5{animation:d5 .74s ease-in-out infinite alternate .1s}
.char .head{animation:headBob .7s ease-in-out infinite alternate}
@keyframes headBob{from{transform:translateX(-50%) translateY(0)}to{transform:translateX(-50%) translateY(-6px)}}
@keyframes d1{from{transform:translateY(2px) rotate(-6deg)}to{transform:translateY(-18px) rotate(8deg)}}
@keyframes d2{from{transform:translateY(4px) rotate(5deg)}to{transform:translateY(-16px) rotate(-7deg)}}
@keyframes d3{from{transform:translateX(-50%) translateY(3px) rotate(-4deg)}to{transform:translateX(-50%) translateY(-16px) rotate(5deg)}}
@keyframes d4{from{transform:translateY(2px) rotate(-5deg)}to{transform:translateY(-13px) rotate(7deg)}}
@keyframes d5{from{transform:translateY(4px) rotate(5deg)}to{transform:translateY(-17px) rotate(-8deg)}}

.audioBtn{position:absolute;right:14px;top:max(14px,env(safe-area-inset-top));z-index:30;width:44px;height:44px;border-radius:50%;border:1px solid #fff4;background:#0007;color:#fff;font-size:20px;cursor:pointer}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:100}
.flash.on{animation:flash .55s ease}@keyframes flash{0%{opacity:0}28%{opacity:.96}100%{opacity:0}}
.confetti{position:absolute;top:-25px;width:13px;height:8px;border-radius:2px;z-index:25;animation:fall linear forwards}@keyframes fall{from{opacity:1;transform:translate(0,0) rotate(0)}to{opacity:0;transform:translate(var(--dx),115vh) rotate(780deg)}}

@media(max-width:760px){
 .alertBox{width:91vw;padding:24px 16px}.warningTape{height:42px}
 .marquee{width:95vw;padding:14px 48px;border-radius:24px}.marquee:before{left:9px}.marquee:after{right:9px}
 .stage{width:100vw;height:min(76vh,680px);bottom:7vh}
 .char{width:96px;height:158px}.hero{width:148px;height:238px}
 .head{width:69px;height:80px}.hero .head{width:104px;height:118px}
 .body{width:62px;height:76px}.hero .body{width:94px;height:118px}
 .arm{width:14px;height:48px}.arm:after{width:18px;height:18px}
 .hero .arm{width:20px;height:70px}.hero .arm:after{width:25px;height:25px}
 .leg{width:15px;height:46px}.leg:after{width:23px;height:11px}
 .hero .leg{width:20px;height:65px}.hero .leg:after{width:29px;height:13px}
 .c1{left:-3%;bottom:13%}.c2{left:12%;bottom:17%}.c4{right:11%;bottom:13%}.c5{right:-3%;bottom:14%}
 .startBtn{font-size:15px;padding:13px 22px}
}
</style>
</head>
<body>
<div class="scene" id="scene">

  <section class="emergency">
    <div class="sirenTop"></div><div class="sirenBottom"></div>
    <div class="light red"></div><div class="light blue"></div>

    <div class="alertBox">
      <div class="alertIcon">⚠️</div>

    </div>
    <button class="startBtn" id="startBtn">속보 확인하기</button>
  </section>

  <section class="party">
    <div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div><div class="beam b4"></div><div class="beam b5"></div>

 function drum(t,p=120,d=.11,v=.7){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(p,t);o.frequency.exponentialRampToValueAtTime(60,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02)}
 function tone(f,t,d,v=.06){const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03)}
 function crash(t){const b=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=ctx.createBufferSource(),hp=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=b;hp.type='highpass';hp.frequency.value=2600;g.gain.setValueAtTime(.45,t);g.gain.exponentialRampToValueAtTime(.001,t+.9);s.connect(hp);hp.connect(g);g.connect(master);s.start(t);s.stop(t+1)}
 function confetti(){const colors=['#ff4e95','#ffd54b','#32c9ff','#7fff77','#b452ff','#ff933f'];for(let i=0;i<110;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=colors[Math.floor(Math.random()*colors.length)];c.style.setProperty('--dx',(Math.random()-.5)*400+'px');c.style.animationDuration=(2.2+Math.random()*1.7)+'s';scene.appendChild(c);setTimeout(()=>c.remove(),4200)}}
 function bgLoop(st){const notes=[523,659,784,1047,988,784,659,587,659,784,1047,1175,1047,988,784,659];let t=st;for(let i=0;i<notes.length;i++){tone(notes[i],t,.32,.055);if(i%4===0)drum(t,95,.08,.12);t+=.34}return t}
 function keep(){if(!bgm)return;next=bgLoop(next);setTimeout(keep,Math.max(300,(next-ctx.currentTime-.4)*1000))}
 async function start(){
   btn.disabled=true;
   init(); if(ctx.state==='suspended')await ctx.resume();
   const n=ctx.currentTime+.05,int=.13;
   for(let i=0;i<8;i++)drum(n+i*int,125+i*3,.1,.75);
   const bam=n+8*int+.12; drum(bam,90,.4,1.0); crash(bam);
   setTimeout(()=>{scene.classList.add('revealed');flash.classList.add('on');confetti();audioBtn.hidden=false;setTimeout(()=>flash.classList.remove('on'),650);bgm=true;next=ctx.currentTime+.18;keep()},Math.max(0,(bam-ctx.currentTime)*1000));
 }
 btn.addEventListener('click',start);
 audioBtn.addEventListener('click',()=>{muted=!muted;master.gain.setTargetAtTime(muted?0:.8,ctx.currentTime,.03);audioBtn.textContent=muted?'🔇':'🔊'});
})();
</script>
</body>
