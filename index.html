<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#150003">
<title>속보입니다</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070006;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
body{user-select:none;-webkit-user-select:none}
button{font:inherit}
.scene{position:relative;width:100vw;height:100dvh;min-height:100vh;overflow:hidden;color:#fff;background:#09000b}

/* 1) 긴급 속보 화면 */
.intro{position:absolute;inset:0;z-index:30;overflow:hidden;background:radial-gradient(circle at 50% 47%,#72090d 0,#310104 40%,#090001 78%);transition:opacity .62s ease,transform .68s ease,filter .68s ease}
.scene.revealed .intro{opacity:0;transform:scale(1.075);filter:blur(7px);pointer-events:none}
.hazard{position:absolute;left:-4%;width:108%;height:52px;background:repeating-linear-gradient(135deg,#ffd32b 0 34px,#121212 34px 68px);box-shadow:0 5px 18px #000c}
.hazard.top{top:0}
.hazard.bottom{bottom:0}
.grid{position:absolute;inset:0;opacity:.08;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:36px 36px;mask-image:radial-gradient(circle at center,#000,transparent 76%)}
.sirenGlow{position:absolute;top:0;width:42vw;height:78vh;filter:blur(40px);mix-blend-mode:screen;opacity:.05}
.sirenGlow.red{left:-16vw;background:radial-gradient(ellipse,#ff2020 0 20%,transparent 64%);animation:redFlash .72s steps(1) infinite}
.sirenGlow.blue{right:-16vw;background:radial-gradient(ellipse,#2878ff 0 20%,transparent 64%);animation:blueFlash .72s steps(1) infinite}
@keyframes redFlash{0%,49%{opacity:.82}50%,100%{opacity:.05}}
@keyframes blueFlash{0%,49%{opacity:.05}50%,100%{opacity:.82}}
.beacon{position:absolute;top:8%;width:116px;height:92px;z-index:4}
.beacon.red{left:6%;color:#ff2828}
.beacon.blue{right:6%;color:#3d88ff}
.beacon .dome{position:absolute;left:20px;right:20px;top:0;height:66px;border-radius:55% 55% 28% 28%;background:linear-gradient(90deg,currentColor,#fff8 47%,currentColor);border:5px solid #fff5;box-shadow:0 0 35px currentColor,inset 0 0 28px #fff8;animation:beaconPulse .72s steps(1) infinite}
.beacon.blue .dome{animation-delay:.36s}
.beacon .base{position:absolute;left:13px;right:13px;bottom:5px;height:22px;border-radius:7px;background:#161616;box-shadow:0 5px 10px #0009}
@keyframes beaconPulse{50%{filter:brightness(.3);box-shadow:none}}
.pipo{position:absolute;top:19%;font-size:clamp(16px,2.3vw,28px);font-weight:1000;letter-spacing:.18em;text-shadow:0 0 15px currentColor;z-index:5}
.pipo.left{left:7%;color:#ff8d8d;animation:pipoL .72s steps(1) infinite}
.pipo.right{right:7%;color:#92b9ff;animation:pipoR .72s steps(1) infinite}
@keyframes pipoL{0%,49%{opacity:1}50%,100%{opacity:.16}}
@keyframes pipoR{0%,49%{opacity:.16}50%,100%{opacity:1}}
.alertCard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90vw,900px);padding:32px 26px 30px;border:4px solid #ffd22f;border-radius:26px;background:linear-gradient(180deg,rgba(128,10,14,.98),rgba(54,0,4,.99) 62%,rgba(20,0,2,.99));box-shadow:0 0 0 8px #111,0 0 58px #ff2b1e70,inset 0 0 42px #ff8c1730;text-align:center;z-index:8}
.badge{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;background:#180001;border:2px solid #ffbd18;color:#ffe261;font-size:clamp(14px,2vw,21px);font-weight:1000;letter-spacing:.1em}
.dot{width:10px;height:10px;border-radius:50%;background:#ff2c2c;box-shadow:0 0 15px #ff2c2c;animation:blink .5s steps(1) infinite}
@keyframes blink{50%{opacity:.18}}
.alertCard h1{margin:14px 0 8px;font-size:clamp(54px,10.5vw,122px);line-height:.94;font-weight:1000;letter-spacing:-.07em;color:#fff1d2;text-shadow:0 5px 0 #740000,0 0 23px #ff3a23;animation:jolt 1.45s ease-in-out infinite}
@keyframes jolt{0%,88%,100%{transform:translateX(0)}91%{transform:translateX(-4px)}94%{transform:translateX(4px)}97%{transform:translateX(-2px)}}
.sub{margin-top:17px;color:#ffe05b;font-size:clamp(18px,3vw,30px);font-weight:900}
.mini{margin-top:7px;color:#ffd8d0;opacity:.86;font-size:clamp(13px,1.8vw,17px)}
.start{margin-top:24px;border:0;border-radius:999px;padding:15px 30px;background:linear-gradient(#ffeb7b,#ffb815);color:#210000;font-size:17px;font-weight:1000;cursor:pointer;box-shadow:0 12px 30px #ffb00045,inset 0 2px 0 #fff9;transition:transform .16s,filter .16s}
.start:hover{filter:brightness(1.06);transform:translateY(-1px)}
.start:active{transform:translateY(2px)}
.start:disabled{opacity:.75;cursor:default}

/* 2) 반전 축하 무대 */
.party{position:absolute;inset:0;opacity:0;transform:scale(.965);pointer-events:none;overflow:hidden;background:radial-gradient(circle at 50% 68%,#903bc55d 0,transparent 30%),linear-gradient(#19062f,#090212);transition:opacity .63s ease .08s,transform .75s cubic-bezier(.2,.9,.2,1) .08s}
.scene.revealed .party{opacity:1;transform:scale(1);pointer-events:auto}
.curtain{position:absolute;top:0;bottom:0;width:23%;z-index:1;background:repeating-linear-gradient(90deg,#4a000d 0 27px,#a90d24 27px 55px,#4a000d 55px 82px);filter:drop-shadow(0 0 16px #000a)}
.curtain.left{left:-10%;transform:skewX(-5deg)}
.curtain.right{right:-10%;transform:skewX(5deg)}
.beam{position:absolute;top:-18vh;left:50%;width:10.5vw;height:120vh;clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);transform-origin:50% 0;mix-blend-mode:screen;opacity:.84;z-index:2}
.b1{background:#ffd746;animation:s1 4.8s ease-in-out infinite alternate}.b2{background:#31e6a5;animation:s2 5.5s ease-in-out infinite alternate}.b3{background:#35bfff;animation:s3 4.3s ease-in-out infinite alternate}.b4{background:#b74bff;animation:s4 5.0s ease-in-out infinite alternate}.b5{background:#ff359b;animation:s5 4.6s ease-in-out infinite alternate}.b6{background:#ff9c43;animation:s6 5.3s ease-in-out infinite alternate}
@keyframes s1{from{transform:translateX(-50%) rotate(-36deg)}to{transform:translateX(-50%) rotate(-9deg)}}@keyframes s2{from{transform:translateX(-50%) rotate(-22deg)}to{transform:translateX(-50%) rotate(15deg)}}@keyframes s3{from{transform:translateX(-50%) rotate(-8deg)}to{transform:translateX(-50%) rotate(31deg)}}@keyframes s4{from{transform:translateX(-50%) rotate(12deg)}to{transform:translateX(-50%) rotate(-29deg)}}@keyframes s5{from{transform:translateX(-50%) rotate(29deg)}to{transform:translateX(-50%) rotate(5deg)}}@keyframes s6{from{transform:translateX(-50%) rotate(39deg)}to{transform:translateX(-50%) rotate(-14deg)}}
.floor{position:absolute;left:0;right:0;bottom:0;height:34%;z-index:3;background:linear-gradient(180deg,transparent,#14011bd9),repeating-linear-gradient(90deg,#1a0326 0 54px,#521765 54px 57px,#1a0326 57px 111px);border-top:4px solid #f1c451;box-shadow:0 -10px 42px #f1b83235}
.marquee{position:absolute;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);width:min(94vw,940px);padding:15px 72px;border:5px solid #ffc13b;border-radius:31px;background:linear-gradient(#f14127,#bf1318 73%,#8d0b10);box-shadow:0 12px 34px #0009,inset 0 -5px 0 #720409;text-align:center;z-index:20;overflow:hidden}
.marquee:before{content:"";position:absolute;inset:7px;border-radius:21px;background:radial-gradient(circle,#fff2a8 0 4px,transparent 5px) 0 0/34px 34px;opacity:.62}
.marquee:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 20%,#ffffff30 46%,transparent 58%);animation:shine 2.8s linear infinite}
@keyframes shine{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
.marquee .star{position:absolute;top:50%;transform:translateY(-50%);font-size:clamp(38px,6vw,68px);color:#ffde50;text-shadow:0 3px 0 #883900;z-index:3}
.marquee .star.left{left:18px}.marquee .star.right{right:18px}
.marquee strong{position:relative;z-index:4;font-size:clamp(40px,7vw,84px);font-weight:1000;letter-spacing:-.06em;color:#ffe25d;text-shadow:0 4px 0 #843800,0 0 13px #fff6;white-space:nowrap}
.gift{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);width:min(26vw,260px);aspect-ratio:1.1/1;z-index:4;filter:drop-shadow(0 18px 30px #0009)}
.gift .box{position:absolute;left:8%;right:8%;top:34%;bottom:4%;border:4px solid #ff9b84;border-radius:8px;background:linear-gradient(135deg,#ff294a,#d70c30)}
.gift .box:before{content:"";position:absolute;left:43%;top:-4px;bottom:-4px;width:15%;background:linear-gradient(#ffe16a,#f5b81f)}
.gift .lid{position:absolute;left:2%;right:2%;top:20%;height:18%;border:4px solid #ffb19c;border-radius:8px;background:linear-gradient(#ff536d,#ed1843)}
.gift .lid:before{content:"";position:absolute;left:44%;top:-4px;bottom:-4px;width:14%;background:#ffd34f}
.gift .bow{position:absolute;left:50%;top:2%;width:88px;height:58px;transform:translateX(-50%)}
.gift .bow:before,.gift .bow:after{content:"";position:absolute;top:0;width:50px;height:40px;border:12px solid #ffd748;border-radius:50%}
.gift .bow:before{right:41px;transform:rotate(22deg)}.gift .bow:after{left:41px;transform:rotate(-22deg)}
.cast{position:absolute;left:50%;bottom:max(1.5vh,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(100vw,1260px);height:min(76vh,810px);z-index:12}
.person{position:absolute;bottom:0;transform-origin:50% 100%;filter:drop-shadow(0 15px 13px #0008)}
.person img{display:block;width:100%;height:auto;pointer-events:none}
.p1{left:1%;width:23%;max-width:286px;animation:d1 .78s ease-in-out infinite alternate}.p2{left:18%;bottom:4%;width:19.5%;max-width:246px;animation:d2 .83s ease-in-out infinite alternate .1s}.p3{left:50%;bottom:0;width:30.5%;max-width:390px;transform:translateX(-50%);z-index:6;animation:d3 .74s ease-in-out infinite alternate}.p4{right:18%;bottom:5%;width:19.5%;max-width:245px;animation:d4 .86s ease-in-out infinite alternate .18s}.p5{right:1%;width:26%;max-width:325px;animation:d5 .8s ease-in-out infinite alternate .07s}
@keyframes d1{from{transform:translateY(3px) rotate(-4deg) scale(1)}to{transform:translateY(-18px) rotate(5deg) scale(1.015)}}@keyframes d2{from{transform:translateY(3px) rotate(4deg)}to{transform:translateY(-16px) rotate(-5deg)}}@keyframes d3{from{transform:translateX(-50%) translateY(4px) rotate(-2.5deg) scale(1)}to{transform:translateX(-50%) translateY(-16px) rotate(2.5deg) scale(1.015)}}@keyframes d4{from{transform:translateY(3px) rotate(-4deg)}to{transform:translateY(-15px) rotate(5deg)}}@keyframes d5{from{transform:translateY(3px) rotate(4deg)}to{transform:translateY(-18px) rotate(-5deg)}}
.audio{position:absolute;right:14px;top:max(14px,env(safe-area-inset-top));z-index:40;width:44px;height:44px;border-radius:50%;border:1px solid #fff4;background:#0008;color:#fff;font-size:20px;cursor:pointer;backdrop-filter:blur(8px)}
.flash{position:absolute;inset:0;z-index:60;background:#fff;opacity:0;pointer-events:none}.flash.on{animation:flash .54s ease}@keyframes flash{0%{opacity:0}28%{opacity:.97}100%{opacity:0}}
.confetti{position:absolute;top:-25px;width:13px;height:8px;border-radius:2px;z-index:45;animation:fall linear forwards}@keyframes fall{from{opacity:1;transform:translate(0,0) rotate(0)}to{opacity:0;transform:translate(var(--dx),115vh) rotate(780deg)}}

@media(max-width:720px){
 .hazard{height:36px}.beacon{top:6%;transform:scale(.72)}.beacon.red{left:1%}.beacon.blue{right:1%}.pipo{top:17%;font-size:13px}.pipo.left{left:4%}.pipo.right{right:4%}
 .alertCard{width:92vw;padding:25px 15px 24px;border-width:3px;box-shadow:0 0 0 5px #111,0 0 40px #ff2b1e64,inset 0 0 34px #ff8c172c}.alertCard h1{margin-top:12px}.start{margin-top:20px;padding:14px 23px;font-size:15px}
 .marquee{width:96vw;padding:11px 44px;border-width:4px;border-radius:24px}.marquee .star.left{left:8px}.marquee .star.right{right:8px}
 .cast{height:66vh;bottom:1vh}.gift{top:56%;width:31vw}
 .p1{left:-2%;width:23%;bottom:1%}.p2{left:18%;width:21%;bottom:14%}.p3{width:38%;bottom:1%}.p4{right:18%;width:21%;bottom:14%}.p5{right:-2%;width:23%;bottom:1%}
 .audio{right:10px;top:max(10px,env(safe-area-inset-top));width:42px;height:42px}
}
@media(max-height:620px) and (orientation:landscape){.alertCard{top:52%;padding:18px 22px}.alertCard h1{font-size:min(15vh,90px)}.sub{margin-top:9px}.mini{display:none}.start{margin-top:13px;padding:11px 22px}.beacon{display:none}.pipo{display:none}.cast{height:58vh;bottom:-2vh}.p1{left:2%;width:17%}.p2{left:20%;width:15%;bottom:1%}.p3{width:24%;bottom:-2%}.p4{right:20%;width:15%;bottom:1%}.p5{right:2%;width:18%}.gift{width:18vw;top:63%}.marquee{padding-top:8px;padding-bottom:8px;min-height:auto}.marquee strong{font-size:min(12vh,64px)}}
</style>
</head>
<body>
<main class="scene" id="scene">
 <section class="intro">
  <div class="hazard top"></div><div class="hazard bottom"></div><div class="grid"></div>
  <div class="sirenGlow red"></div><div class="sirenGlow blue"></div>
  <div class="beacon red"><div class="dome"></div><div class="base"></div></div>
  <div class="beacon blue"><div class="dome"></div><div class="base"></div></div>
  <div class="pipo left">삐뽀! 삐뽀!</div><div class="pipo right">삐뽀! 삐뽀!</div>
  <div class="alertCard">
   <div class="badge"><span class="dot"></span>긴급 · 중요 공지<span class="dot"></span></div>
   <h1>속보입니다</h1>
   <div class="sub">주의! 중요한 소식이 있습니다</div>
   <div class="mini">버튼을 누르면 속보를 확인합니다</div>
   <button class="start" id="start" disabled>화면 준비 중…</button>
  </div>
 </section>
 <section class="party">
  <div class="curtain left"></div><div class="curtain right"></div>
  <i class="beam b1"></i><i class="beam b2"></i><i class="beam b3"></i><i class="beam b4"></i><i class="beam b5"></i><i class="beam b6"></i>
  <div class="floor"></div>
  <div class="marquee"><span class="star left">★</span><strong>속 보인다구요</strong><span class="star right">★</span></div>
  <div class="gift"><i class="bow"></i><i class="lid"></i><i class="box"></i></div>
  <div class="cast">
   <div class="person p1"><img alt="춤추는 캐릭터 1" src="char1.webp"></div>
   <div class="person p2"><img alt="춤추는 캐릭터 2" src="char2.webp"></div>
   <div class="person p3"><img alt="춤추는 캐릭터 3" src="char3.webp"></div>
   <div class="person p4"><img alt="춤추는 캐릭터 4" src="char4.webp"></div>
   <div class="person p5"><img alt="춤추는 캐릭터 5" src="char5.webp"></div>
  </div>
  <button class="audio" id="audio" hidden aria-label="음악 끄기">🔊</button>
 </section>
 <div class="flash" id="flash"></div>
</main>
<script>
(()=>{
 const scene=document.getElementById('scene'),start=document.getElementById('start'),flash=document.getElementById('flash'),audio=document.getElementById('audio');
 let ctx=null,master=null,muted=false,bgm=false,next=0,loopTimer=null,started=false;
 const imgs=[...document.querySelectorAll('.person img')]; Promise.all(imgs.map(img=>img.complete&&img.naturalWidth?Promise.resolve():new Promise((ok,fail)=>{img.addEventListener('load',ok,{once:true});img.addEventListener('error',fail,{once:true})}))).then(()=>{start.disabled=false;start.textContent='🚨 속보 확인하기'}).catch(e=>{console.error(e);start.textContent='새로고침해 주세요'});
 function initAudio(){if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();master=ctx.createGain();master.gain.value=.82;master.connect(ctx.destination)}return ctx}
 function oscTone(freq,t,d,v=.08,type='triangle'){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.018);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.04)}
 function drum(t,p=126,d=.11,v=.72){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(p,t);o.frequency.exponentialRampToValueAtTime(58,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03)}
 function crash(t){const b=ctx.createBuffer(1,Math.floor(ctx.sampleRate*1.1),ctx.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=ctx.createBufferSource(),hp=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=b;hp.type='highpass';hp.frequency.value=2800;g.gain.setValueAtTime(.48,t);g.gain.exponentialRampToValueAtTime(.001,t+1);s.connect(hp);hp.connect(g);g.connect(master);s.start(t);s.stop(t+1.02)}
 function confetti(){const colors=['#ff4e98','#ffd54b','#35c9ff','#7fff72','#b650ff','#ff953e'];for(let i=0;i<130;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=colors[Math.floor(Math.random()*colors.length)];c.style.setProperty('--dx',(Math.random()-.5)*430+'px');c.style.animationDuration=(2.1+Math.random()*1.8)+'s';scene.appendChild(c);setTimeout(()=>c.remove(),4300)}}
 function musicPhrase(st){
  // 익숙한 '축하합니다 / Happy Birthday to You' 계열 멜로디를 3/4박자로 반복한다.
  const bpm=108, beat=60/bpm;
  const seq=[
   [392.00,.5],[392.00,.5],[440.00,1],[392.00,1],[523.25,1],[493.88,2],
   [392.00,.5],[392.00,.5],[440.00,1],[392.00,1],[587.33,1],[523.25,2],
   [392.00,.5],[392.00,.5],[783.99,1],[659.25,1],[523.25,1],[493.88,1],[440.00,2],
   [698.46,.5],[698.46,.5],[659.25,1],[523.25,1],[587.33,1],[523.25,2]
  ];
  let t=st, beatPos=0;
  const chords=[
   [0,[261.63,329.63,392.00]],[6,[196.00,246.94,293.66]],[12,[261.63,329.63,392.00]],
   [18,[196.00,246.94,293.66]],[24,[261.63,329.63,392.00]],[31,[349.23,440.00,523.25]],
   [37,[261.63,329.63,392.00]],[43,[196.00,246.94,293.66]]
  ];
  let ci=0;
  for(const [freq,dur] of seq){
    while(ci<chords.length && chords[ci][0]<=beatPos){
      const [pos,ns]=chords[ci++]; const ct=st+pos*beat;
      ns.forEach((n,j)=>oscTone(n,ct,beat*2.5,.020,j===0?'sine':'triangle'));
      drum(ct,92,.09,.075);
    }
    const d=dur*beat;
    oscTone(freq,t,Math.max(.10,d*.88),.060,'triangle');
    oscTone(freq*2,t+.008,Math.max(.08,d*.68),.016,'sine');
    t+=d; beatPos+=dur;
  }
  return t+beat*.35;
 }
 function keepMusic(){if(!bgm)return;next=musicPhrase(next);const wait=Math.max(250,(next-ctx.currentTime-.35)*1000);loopTimer=setTimeout(keepMusic,wait)}
 async function begin(){if(started)return;started=true;start.disabled=true;start.textContent='두구두구두구…';initAudio();if(ctx.state==='suspended')await ctx.resume();
  const t=ctx.currentTime+.05;oscTone(880,t,.18,.11,'square');oscTone(660,t+.2,.18,.11,'square');oscTone(880,t+.4,.18,.11,'square');oscTone(660,t+.6,.18,.11,'square');
  const roll=t+.85;for(let i=0;i<9;i++)drum(roll+i*.12,125+i*2,.10,.76);const bam=roll+9*.12+.10;drum(bam,88,.42,1.0);crash(bam);
  setTimeout(()=>{scene.classList.add('revealed');flash.classList.add('on');confetti();audio.hidden=false;setTimeout(()=>flash.classList.remove('on'),620);bgm=true;next=ctx.currentTime+.18;keepMusic()},Math.max(0,(bam-ctx.currentTime)*1000));
 }
 start.addEventListener('click',begin);
 audio.addEventListener('click',()=>{if(!master)return;muted=!muted;master.gain.setTargetAtTime(muted?0:.82,ctx.currentTime,.03);audio.textContent=muted?'🔇':'🔊';audio.setAttribute('aria-label',muted?'음악 켜기':'음악 끄기')});
})();
</script>
</body></html>
